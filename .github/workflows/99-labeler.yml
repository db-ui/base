---
name: "Pull Request Labeler"
on:
  workflow_call:

jobs:
  triage:
    runs-on: ubuntu-26.04
    steps:
      - name: 🏷️ Labeler
        uses: actions/labeler@v6
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          sync-labels: true
